[package]
name = "roblox-studio-linux-launcher"
version = "0.1.0"
edition = "2021"
description = "An unofficial Linux launcher for the Windows build of Roblox Studio through Wine."
readme = "README.md"
homepage = "https://github.com/CheckPickerUpper/roblox-studio-for-linux"
repository = "https://github.com/CheckPickerUpper/roblox-studio-for-linux"
license = "LicenseRef-proprietary"

[dependencies]
atomic-write-file = "0.3.1"
clap = { version = "4.6.6", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
md5 = "0.7"
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-async-rw"] }
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = "2.12"
url = "2"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
behave = "0.9.2"

[profile.release]
strip = true
